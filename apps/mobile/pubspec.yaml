name: biz_erp_mobile
description: 'BizERP Mobile POS'
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Phase 1B.1 — Local database foundation
  drift: ^2.34.3
  sqlite3: ^3.5.1
  flutter_secure_storage: ^11.0.0
  uuid: ^4.5.1
  path_provider: ^2.1.6
  path: ^1.9.1
  permission_handler: ^11.3.1
  connectivity_plus: ^6.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.5
  build_runner: ^2.4.13
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

# TASK 2 — sqlite3 hook configuration (4 lines only)
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
