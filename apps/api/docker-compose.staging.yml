version: '3.9'

networks:
  api-staging-internal:
    driver: bridge
  db-staging-internal:
    driver: bridge

volumes:
  bizerp_staging_pgdata:
  certbot_staging_webroot:
  certbot_staging_certs:

services:
  postgres:
    image: postgres:16
    container_name: bizerp_staging_postgres
    environment:
      POSTGRES_USER: ${STAGING_POSTGRES_USER:-bizerp_staging}
      POSTGRES_PASSWORD: ${STAGING_POSTGRES_PASSWORD:-bizerp_staging}
      POSTGRES_DB: ${STAGING_POSTGRES_DB:-bizerp_staging}
    networks:
      - db-staging-internal
    volumes:
      - bizerp_staging_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${STAGING_POSTGRES_USER:-bizerp_staging} -d ${STAGING_POSTGRES_DB:-bizerp_staging}']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: always

  api:
    image: ${STAGING_IMAGE:-bizerp-api:staging}
    container_name: bizerp_staging_api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: staging
      PORT: 8080
      HOST: 0.0.0.0
      DATABASE_URL: ${STAGING_DATABASE_URL:-postgres://bizerp_staging:bizerp_staging@postgres:5432/bizerp_staging}
      JWT_SECRET: ${STAGING_JWT_SECRET}
      JWT_ISSUER: ${STAGING_JWT_ISSUER:-biz-erp-staging}
      JWT_AUDIENCE: ${STAGING_JWT_AUDIENCE:-biz-erp-mobile-staging}
    networks:
      - db-staging-internal
      - api-staging-internal
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:8080/health']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  nginx:
    image: nginx:alpine
    container_name: bizerp_staging_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_staging_webroot:/var/www/certbot
      - certbot_staging_certs:/etc/letsencrypt
    depends_on:
      api:
        condition: service_healthy
    networks:
      - api-staging-internal
    restart: always
