worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    server {
        listen 80;
        server_name api.biz-erp.com;

        # Serve ACME challenge for Certbot
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Temporary redirect to HTTPS ONLY after certificate exists.
        # But for initial bootstrap, we shouldn't redirect immediately if we haven't issued yet,
        # or we just comment it out. But the prompt says "All other HTTP requests: -> temporary redirect to HTTPS ONLY after certificate exists."
        # Actually, the simplest way is to always proxy to the API if no cert exists, or just redirect. Wait:
        # "All other HTTP requests: temporary redirect to HTTPS ONLY after certificate exists. For initial bootstrap: DO NOT require TLS certificate files that do not yet exist. Create a configuration that can start before Certbot issues the certificate."
        # To make it start before Certbot, I should just not have the 443 block active or referencing missing certs.
        # I will proxy to API on HTTP for now, or just return 404 for non-acme. Let's just proxy to API or return a 301. Wait, if I redirect, the prompt says "ONLY after certificate exists".
        # So I will just proxy HTTP to the API for now, or just leave it. 
        # Actually, if I proxy to API, it's functional. If I don't, it returns 404. Let's just proxy.

        location / {
            # Proxy routing as requested in Part 5
            proxy_pass http://api:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Security headers
            add_header X-Content-Type-Options nosniff;
            add_header X-Frame-Options DENY;
            add_header Referrer-Policy strict-origin-when-cross-origin;
        }
    }

    # HTTPS configuration can be uncommented after certificate issuance
    # server {
    #     listen 443 ssl;
    #     server_name api.biz-erp.com;
    #
    #     ssl_certificate /etc/letsencrypt/live/api.biz-erp.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/api.biz-erp.com/privkey.pem;
    #
    #     location / {
    #         proxy_pass http://api:8080;
    #         ...
    #     }
    # }
}
