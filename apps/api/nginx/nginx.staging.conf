events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    server_tokens off;
    server_names_hash_bucket_size 64;

    # HTTP Server - Redirect to HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name staging-api.skmnetwork.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS Server
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name staging-api.skmnetwork.com;

        ssl_certificate /etc/letsencrypt/live/staging-api.skmnetwork.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/staging-api.skmnetwork.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # NO HSTS per requirements
        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location / {
            proxy_pass http://api:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # HTTP Server - Web ERP redirect to HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name staging-erp.skmnetwork.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS Server - Web ERP (proxy to Next.js container)
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name staging-erp.skmnetwork.com;

        ssl_certificate /etc/letsencrypt/live/staging-erp.skmnetwork.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/staging-erp.skmnetwork.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # NO HSTS per requirements
        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location / {
            proxy_pass http://web:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # HTTP Server - Landing redirect to HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name www.skmnetwork.com skmnetwork.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://www.skmnetwork.com$request_uri;
        }
    }

    # HTTPS Server - Apex redirect to WWW (canonical)
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name skmnetwork.com;

        ssl_certificate /etc/letsencrypt/live/staging-api.skmnetwork.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/staging-api.skmnetwork.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # NO HSTS per requirements
        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location / {
            return 301 https://www.skmnetwork.com$request_uri;
        }
    }

    # HTTPS Server - Static landing
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name www.skmnetwork.com;

        ssl_certificate /etc/letsencrypt/live/staging-api.skmnetwork.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/staging-api.skmnetwork.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # NO HSTS per requirements
        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        root /var/www/skmnetwork-landing/current;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location ~* \.(html)$ {
            add_header Cache-Control "no-cache";
        }
    }

    # HTTP Server - License Server Redirect & ACME Challenge
    server {
        listen 80;
        listen [::]:80;
        server_name license.skmnetwork.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS Server - Buku Warung License Server API & Admin Dashboard
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name license.skmnetwork.com;

        ssl_certificate /etc/letsencrypt/live/license.skmnetwork.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/license.skmnetwork.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # 1. License Server Health Check
        location = /health {
            proxy_pass http://bukuwarung_license_server:3000/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. License Server REST API (/v1/*)
        location /v1/ {
            proxy_pass http://bukuwarung_license_server:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        # 3. Public Download Page & APK/PDF Distribution (/download/*)
        location /download/ {
            proxy_pass http://bukuwarung_license_server:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 8 64k;
        }

        # 3.1 Public Order Page (/beli/*)
        location /beli/ {
            proxy_pass http://bukuwarung_license_server:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            proxy_buffering off;
        }

        # 4. Admin Dashboard Web UI & Session BFF
        location / {
            proxy_pass http://bukuwarung_license_admin:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }
    }
}
