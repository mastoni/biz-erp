events {
    worker_connections 1024;
}

http {
    server_tokens off;
    server_names_hash_bucket_size 64;

    # HTTP Server - Redirect to HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name staging-api.skmnetwork.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS Server
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name staging-api.skmnetwork.com;

        ssl_certificate /etc/letsencrypt/live/staging-api.skmnetwork.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/staging-api.skmnetwork.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # NO HSTS per requirements
        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location / {
            proxy_pass http://api:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # HTTP Server - Landing redirect to HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name www.skmnetwork.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS Server - Static landing
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name www.skmnetwork.com;

        ssl_certificate /etc/letsencrypt/live/www.skmnetwork.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/www.skmnetwork.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # NO HSTS per requirements
        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        root /var/www/skmnetwork-landing/current;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location ~* \.(html)$ {
            add_header Cache-Control "no-cache";
        }
    }
}
