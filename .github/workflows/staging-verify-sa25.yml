name: Staging Auth Verification SA-2.5

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./apps/api
        run: npm ci

      - name: Run Verification Script
        working-directory: ./apps/api
        env:
          SUPERADMIN_EMAIL: ${{ secrets.SUPERADMIN_EMAIL }}
          SUPERADMIN_PASSWORD: ${{ secrets.SUPERADMIN_PASSWORD }}
          API_URL: 'https://staging-api.skmnetwork.com'
        run: npx tsx scripts/verify-staging-sa2-5.ts
