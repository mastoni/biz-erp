name: Production Artifact Build

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: 'Git ref (branch, tag, or SHA) to build'
        required: true
        default: 'main'

concurrency:
  group: production-build
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  validation-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: bizerp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        working-directory: ./apps/api
        run: npm ci

      - name: Run backend tests
        working-directory: ./apps/api
        env:
          TEST_DATABASE_URL: postgres://test_user:test_password@localhost:5432/bizerp_test
        run: npm test

      - name: Run backend typecheck
        working-directory: ./apps/api
        run: npm run typecheck

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Flutter analyze and test
        working-directory: ./apps/mobile
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build apk --release

      - name: Build API Docker image
        working-directory: ./apps/api
        run: docker build -t ghcr.io/${{ github.repository_owner }}/bizerp-api:${{ github.sha }} .

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        run: docker push ghcr.io/${{ github.repository_owner }}/bizerp-api:${{ github.sha }}
