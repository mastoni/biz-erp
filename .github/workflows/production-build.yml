name: Production Artifact Build

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: 'Git ref (branch, tag, or SHA) to build'
        required: true
        default: 'main'

concurrency:
  group: production-build
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  validation-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: bizerp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git_ref }}

      - name: Get Exact SHA
        id: exact_sha
        run: |
          EXACT_SHA=$(git rev-parse HEAD)
          echo "sha=$EXACT_SHA" >> $GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        working-directory: ./apps/api
        run: npm ci

      - name: Run backend tests
        working-directory: ./apps/api
        env:
          TEST_DATABASE_URL: postgres://test_user:test_password@localhost:5432/bizerp_test
          DATABASE_URL: postgres://test_user:test_password@localhost:5432/bizerp_test
          JWT_SECRET: ci-test-only-secret-DO-NOT-USE-IN-PRODUCTION
          JWT_ISSUER: biz-erp-test
          JWT_AUDIENCE: biz-erp-test
        run: npm test

      - name: Run backend typecheck
        working-directory: ./apps/api
        run: npm run typecheck

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Flutter analyze and test
        working-directory: ./apps/mobile
        run: |
          flutter pub get
          flutter analyze --no-fatal-warnings
          flutter test

      - name: Build API Docker image
        working-directory: ./apps/api
        run: docker build -t ghcr.io/${{ github.repository_owner }}/bizerp-api:${{ steps.exact_sha.outputs.sha }} .

      - name: Set up Node.js (web)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web dependencies
        working-directory: ./apps/web
        run: npm ci

      - name: Run web tests
        working-directory: ./apps/web
        run: npm test

      - name: Run web lint
        working-directory: ./apps/web
        run: npm run lint

      - name: Run web typecheck
        working-directory: ./apps/web
        run: npm run typecheck

      - name: Run web build
        working-directory: ./apps/web
        run: npm run build

      - name: Build Web Docker image
        working-directory: ./apps/web
        run: docker build --build-arg NEXT_PUBLIC_API_URL=https://api.skmnetwork.com -t ghcr.io/${{ github.repository_owner }}/bizerp-web:${{ steps.exact_sha.outputs.sha }} .

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push API image to GHCR
        run: docker push ghcr.io/${{ github.repository_owner }}/bizerp-api:${{ steps.exact_sha.outputs.sha }}

      - name: Push Web image to GHCR
        run: docker push ghcr.io/${{ github.repository_owner }}/bizerp-web:${{ steps.exact_sha.outputs.sha }}

      - name: Verify Web image in GHCR
        run: docker manifest inspect ghcr.io/${{ github.repository_owner }}/bizerp-web:${{ steps.exact_sha.outputs.sha }}
