name: Staging Deployment

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bizerp_test
          POSTGRES_PASSWORD: bizerp_test
          POSTGRES_DB: bizerp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        working-directory: ./apps/api
        run: npm ci

      - name: Run database migrations
        working-directory: ./apps/api
        env:
          DATABASE_URL: postgres://bizerp_test:bizerp_test@localhost:5432/bizerp_test
          TEST_DATABASE_URL: postgres://bizerp_test:bizerp_test@localhost:5432/bizerp_test
        run: npm run migrate

      - name: Run backend tests
        working-directory: ./apps/api
        env:
          DATABASE_URL: postgres://bizerp_test:bizerp_test@localhost:5432/bizerp_test
          TEST_DATABASE_URL: postgres://bizerp_test:bizerp_test@localhost:5432/bizerp_test
          JWT_SECRET: insecure-test-secret-that-is-at-least-32-chars-long
          JWT_ISSUER: biz-erp-api
          JWT_AUDIENCE: biz-erp-client
        run: npm test

      - name: Run backend typecheck
        working-directory: ./apps/api
        run: npm run typecheck

      - name: Build backend
        working-directory: ./apps/api
        run: npm run build

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Run Flutter tests
        working-directory: ./apps/mobile
        run: |
          flutter pub get
          flutter test

      - name: Build API Docker image
        working-directory: ./apps/api
        run: docker build -t bizerp-api:${{ github.sha }} .

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push API Docker image
        run: |
          LOWER_REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker tag bizerp-api:${{ github.sha }} ghcr.io/$LOWER_REPO_OWNER/bizerp-api:${{ github.sha }}-staging
          docker push ghcr.io/$LOWER_REPO_OWNER/bizerp-api:${{ github.sha }}-staging

      - name: Build Web Docker image
        working-directory: ./apps/web
        run: docker build -t bizerp-web:${{ github.sha }}-staging --build-arg NEXT_PUBLIC_API_URL=https://staging-api.skmnetwork.com .

      - name: Push Web Docker image
        run: |
          LOWER_REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker tag bizerp-web:${{ github.sha }}-staging ghcr.io/$LOWER_REPO_OWNER/bizerp-web:${{ github.sha }}-staging
          docker push ghcr.io/$LOWER_REPO_OWNER/bizerp-web:${{ github.sha }}-staging

  deploy-staging:
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy to staging VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          REPO_OWNER: ${{ github.repository_owner }}
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USERNAME }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          envs: GITHUB_TOKEN, IMAGE_TAG, ACTOR, REPO_OWNER
          script: |
            set -e

            export LOWER_REPO_OWNER=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
            API_IMAGE_URI="ghcr.io/$LOWER_REPO_OWNER/bizerp-api:${IMAGE_TAG}-staging"

            echo "Logging into GHCR..."
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

            echo "Synchronizing staging repository to exact deployment SHA..."
            cd /opt/skmnet-erp-staging/repo
            git fetch origin
            git reset --hard
            git clean -fd
            git checkout --detach "$IMAGE_TAG"
            if [ "$(git rev-parse HEAD)" != "$IMAGE_TAG" ]; then
              echo "Repository SHA mismatch! Expected: $IMAGE_TAG, Got: $(git rev-parse HEAD)"
              exit 1
            fi

            echo "=== STEP 1: BACKUP AND VALIDATE NGINX CONFIG ==="
            CONF_FILE="/opt/skmnet-erp-staging/repo/apps/api/nginx/nginx.staging.conf"
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            cp -a "$CONF_FILE" "${CONF_FILE}.bak_${TIMESTAMP}"
            echo "Backup created at: ${CONF_FILE}.bak_${TIMESTAMP}"

            echo "=== STEP 2: NGINX -T VALIDATION ==="
            docker exec bizerp_staging_nginx nginx -t

            echo "=== STEP 3: NGINX RESTART (Refresh File Inode) ==="
            docker exec bizerp_staging_nginx nginx -t
            docker restart bizerp_staging_nginx
            docker exec bizerp_staging_nginx nginx -t
            echo "bizerp_staging_nginx successfully restarted and validated."

            echo "=== STEP 4: VERIFY CONFIG CONTENT (nginx -T) ==="
            docker exec bizerp_staging_nginx nginx -T 2>&1 | grep -A 35 -B 5 -Ei 'server_name.*license\.skmnetwork\.com' || true

            echo "Pulling exact immutable API image tag: ${IMAGE_TAG}-staging..."
            docker pull $API_IMAGE_URI

            export STAGING_IMAGE=$API_IMAGE_URI

            WEB_IMAGE_URI="ghcr.io/$LOWER_REPO_OWNER/bizerp-web:${IMAGE_TAG}-staging"
            echo "Pulling exact immutable Web image tag: ${IMAGE_TAG}-staging..."
            docker pull $WEB_IMAGE_URI

            export STAGING_WEB_IMAGE=$WEB_IMAGE_URI

            echo "Restarting services with the new images..."
            docker compose -p bizerp_staging -f apps/api/docker-compose.staging.yml up -d

            echo "Waiting for API and Web health (up to 120 seconds)..."
            TIMEOUT=120
            ELAPSED=0
            while true; do
              API_READY=false
              if docker ps -q -f name=bizerp_staging_api >/dev/null; then
                if docker exec bizerp_staging_api wget --spider -q http://127.0.0.1:8080/health >/dev/null 2>&1; then
                  API_READY=true
                fi
              fi

              WEB_READY=false
              if docker ps -q -f name=bizerp_staging_web >/dev/null; then
                if [ "$(docker inspect --format='{{.State.Health.Status}}' bizerp_staging_web 2>/dev/null)" = "healthy" ]; then
                  WEB_READY=true
                fi
              fi

              if [ "$API_READY" = true ] && [ "$WEB_READY" = true ]; then
                echo "API and Web are healthy and ready!"
                break
              fi

              if [ $ELAPSED -ge $TIMEOUT ]; then
                echo "Error: API and/or Web failed to become healthy within $TIMEOUT seconds!"
                echo "=== Docker Compose PS ==="
                docker compose -p bizerp_staging -f apps/api/docker-compose.staging.yml ps
                echo "=== API Logs ==="
                docker logs bizerp_staging_api --tail 50
                echo "=== Web Logs ==="
                docker logs bizerp_staging_web --tail 50
                echo "=== Postgres Logs ==="
                docker logs bizerp_staging_postgres --tail 50
                exit 1
              fi

              echo "Waiting... (API:$API_READY WEB:$WEB_READY $ELAPSED/$TIMEOUT seconds)"
              sleep 5
              ELAPSED=$((ELAPSED + 5))
            done

            echo "Confirming container identity and environment before migration..."
            RUNNING_CONTAINER=$(docker ps -q -f name=bizerp_staging_api)
            if [ -z "$RUNNING_CONTAINER" ]; then
              echo "Error: bizerp_staging_api container not found!"
              exit 1
            fi

            ENV_CHECK=$(docker exec bizerp_staging_api env | grep NODE_ENV || true)
            if [[ "$ENV_CHECK" != *"NODE_ENV=staging"* ]]; then
              echo "Error: Container is not in staging environment! Found: $ENV_CHECK"
              exit 1
            fi

            if [[ "$ENV_CHECK" == *"NODE_ENV=production"* ]]; then
              echo "Error: Container is in production environment! Aborting migration."
              exit 1
            fi

            echo "Executing database migration safely..."
            # The migrate.js script inherently only runs pending migrations, which for staging are 015 and 016
            docker exec bizerp_staging_api node dist/db/migrate.js

            echo "Verifying HTTPS /health endpoint..."
            curl -fS --retry 5 --retry-delay 5 https://staging-api.skmnetwork.com/health || (echo "Health check failed!" && exit 1)

            echo "Verifying 40B/40C route..."
            STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://staging-api.skmnetwork.com/v1/subscriptions)
            if [ "$STATUS_CODE" = "404" ]; then
              echo "Error: 40B/40C route returned 404!"
              exit 1
            fi

            echo "Verifying Web ERP HTTPS endpoint..."
            curl -fS --retry 5 --retry-delay 5 https://staging-erp.skmnetwork.com/ || (echo "Web ERP health check failed!" && exit 1)

            echo "Deployment successful."

            echo "=== GATE 4C: BUILD AND UPDATE LICENSE SERVER ONLY ==="

            echo "--- STEP 1: PRE-FLIGHT ---"
            docker version
            docker ps
            OLD_IMAGE_ID=$(docker inspect bukuwarung_license_server | jq -r '.[0].Image')
            echo "Current License Server Image ID: $OLD_IMAGE_ID"

            echo "--- STEP 2: LOCATE AND VERIFY BUKU WARUNG DEPLOYMENT REPOSITORY ---"
            BW_REPO_DIR=""
            if [ -d "/opt/buku-warung" ]; then
              BW_REPO_DIR="/opt/buku-warung"
            elif [ -d "/opt/bukuwarung" ]; then
              BW_REPO_DIR="/opt/bukuwarung"
            elif [ -d "/opt/skmnet-bukuwarung" ]; then
              BW_REPO_DIR="/opt/skmnet-bukuwarung"
            elif [ -d "/var/www/buku-warung" ]; then
              BW_REPO_DIR="/var/www/buku-warung"
            else
              FOUND_COMPOSE=$(find /opt /var /home /root -name "docker-compose.production.yml" -exec grep -l "bukuwarung_license_server" {} + 2>/dev/null | head -n 1 || true)
              if [ -n "$FOUND_COMPOSE" ]; then
                BW_REPO_DIR=$(dirname $(dirname "$FOUND_COMPOSE"))
              fi
            fi

            echo "Detected Buku Warung repo path: $BW_REPO_DIR"

            if [ -z "$BW_REPO_DIR" ] || [ ! -d "$BW_REPO_DIR" ]; then
              echo "Cloning canonical repo to /opt/buku-warung..."
              git clone https://github.com/mastoni/buku-warung.git /opt/buku-warung
              BW_REPO_DIR="/opt/buku-warung"
            fi

            cd "$BW_REPO_DIR"
            git fetch origin
            git checkout 4260e0c051f7ef9a46f96748ad2dca7fb8b49322
            CURRENT_HEAD=$(git rev-parse HEAD)
            echo "Checked out commit: $CURRENT_HEAD"
            if [ "$CURRENT_HEAD" != "4260e0c051f7ef9a46f96748ad2dca7fb8b49322" ]; then
              echo "FATAL: Failed to checkout commit 4260e0c051f7ef9a46f96748ad2dca7fb8b49322"
              exit 1
            fi

            echo "Verifying server build context in $BW_REPO_DIR/server..."
            ls -la "$BW_REPO_DIR/server"
            test -f "$BW_REPO_DIR/server/Dockerfile"
            test -f "$BW_REPO_DIR/server/package.json"
            test -f "$BW_REPO_DIR/server/tsconfig.json"
            test -d "$BW_REPO_DIR/server/src"

            echo "--- STEP 3: DATABASE SAFETY AUDIT ---"
            docker inspect bukuwarung_license_server | jq -r '.[0].Mounts[] | select(.Destination | contains("data") or contains("license"))'

            echo "--- STEP 4: BUILD ONLY LICENSE SERVER ---"
            cd "$BW_REPO_DIR/server"
            docker compose -f deploy/docker-compose.production.yml build bukuwarung_license_server

            echo "--- STEP 5: VERIFY IMAGE BEFORE CONTAINER UPDATE ---"
            NEW_IMAGE_ID=$(docker images --no-trunc -q bukuwarung-license-server:production | head -n 1)
            echo "Newly built Image ID: $NEW_IMAGE_ID"

            echo "Verifying dist/server.js in newly built image..."
            docker run --rm bukuwarung-license-server:production node -e '
              const fs = require("fs");
              const content = fs.readFileSync("dist/controllers/publicOrderController.js", "utf8");
              console.log("Image contains publicOrderController:", content.length > 0);
            '

            echo "--- STEP 6: UPDATE ONLY LICENSE SERVER ---"
            cd "$BW_REPO_DIR/server"
            docker compose -f deploy/docker-compose.production.yml up -d --no-deps bukuwarung_license_server

            echo "--- STEP 7: IMMEDIATE CONTAINER CHECK ---"
            sleep 3
            docker ps --filter name=bukuwarung_license_server
            UPDATED_IMAGE_ID=$(docker inspect bukuwarung_license_server | jq -r '.[0].Image')
            echo "Updated Running Container Image ID: $UPDATED_IMAGE_ID"
            docker inspect bukuwarung_license_server | jq '.[0] | {Id: .Id, Image: .Config.Image, ImageId: .Image, Status: .State.Status, Running: .State.Running, Networks: (.NetworkSettings.Networks|keys), Mounts: [.Mounts[] | {Source: .Source, Destination: .Destination, Type: .Type}]}'

            echo "--- STEP 8: HEALTH CHECK ---"
            docker exec bizerp_staging_nginx wget -qS -O - http://bukuwarung_license_server:3000/health 2>&1

            echo "--- STEP 9: CRITICAL ROUTE CHECK ---"
            docker exec bizerp_staging_nginx wget -qS -O - http://bukuwarung_license_server:3000/beli/buku-warung 2>&1 | head -n 40

            echo "--- STEP 10: PUBLIC DOMAIN CHECK ---"
            echo "Public /beli/buku-warung Header:"
            curl -sSI -m 10 https://license.skmnetwork.com/beli/buku-warung

            echo "Public /beli/buku-warung Body Preview:"
            curl -sS -m 10 https://license.skmnetwork.com/beli/buku-warung | head -n 35

            echo "--- STEP 11: REGRESSION SUITE ---"
            echo "1. Health:"
            curl -sSI -m 10 https://license.skmnetwork.com/health
            echo "2. Public Order:"
            curl -sSI -m 10 https://license.skmnetwork.com/beli/buku-warung
            echo "3. API Root /v1/:"
            curl -sSI -m 10 https://license.skmnetwork.com/v1/license/validate || true
            echo "4. Download Binary:"
            curl -sSI -m 10 https://license.skmnetwork.com/download/buku-warung
            echo "5. Download Guide:"
            curl -sSI -m 10 https://license.skmnetwork.com/download/buku-warung/panduan
            echo "6. Admin Root:"
            curl -sS -m 10 https://license.skmnetwork.com/ | head -n 20

            echo "=== GATE 4C VERIFICATION COMPLETE ==="
